[project]
name = "c5-case-sweeper"
version = "0.2.1"
description = "C5GAME 开放平台武器箱行情监控 + 扫货"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    # 官方要求请求头带 Accept-Encoding: gzip, br, zstd, deflate，urllib3 解 br/zstd 需要这两个包
    "urllib3>=2.6",
    "brotli>=1.1",
    "backports.zstd>=1.0; python_version < '3.14'",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx2>=2.13.1",  # fastapi TestClient 用；starlette 已把 httpx 标为弃用
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
