# 推到 main 时构建镜像推到注册表。服务器上 docker compose pull 就能拿到。
#
# 默认推到 GHCR：ghcr.io/<你的账号>/c5bot，不用配任何 secret。
# 服务器在国内拉不动 ghcr.io 的话，改推阿里云容器镜像服务：在仓库 Settings -> Secrets and variables -> Actions 里设
#   Variables: C5_REGISTRY=registry.cn-hangzhou.aliyuncs.com   C5_IMAGE=registry.cn-hangzhou.aliyuncs.com/<命名空间>/c5bot
#   Secrets:   C5_REGISTRY_USER / C5_REGISTRY_PASSWORD
name: c5 image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.C5_REGISTRY || 'ghcr.io' }}
          username: ${{ secrets.C5_REGISTRY_USER || github.actor }}
          password: ${{ secrets.C5_REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: 镜像名和标签（latest + 短 sha，可用 sha 回滚）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.C5_IMAGE || format('ghcr.io/{0}/c5bot', github.repository_owner) }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
